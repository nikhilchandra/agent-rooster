[project]
name = "agent-rooster"
version = "0.1.0"
description = "Infrastructure for building agentic workflows on the Claude Code CLI."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rooster"]

[tool.pytest.ini_options]
markers = [
    "live: calls the claude CLI for real and spends tokens against your plan",
]
