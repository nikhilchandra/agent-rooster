[project]
name = "agent-rooster"
version = "0.1.0"
description = "Build workflows of Claude agents in Python that run on your Claude subscription."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rooster"]

[tool.pytest.ini_options]
# the example under examples/ has a test project of its own, which is not rooster's test suite
testpaths = ["tests"]
# the live tests call the claude CLI and spend tokens, so they run only when asked for with -m live
addopts = "-m 'not live'"
markers = [
    "live: calls the claude CLI for real and spends tokens against your plan",
]
